<script>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const r = st.reply || null;
return {
pending: !r, accepted: r === 'yes', declined: r === 'no',
accept: () => this.setState({ reply: 'yes' }),
decline: () => this.setState({ reply: 'no' }),
undo: () => this.setState({ reply: null })
};
}
}
window.Component = Component;
</script>
