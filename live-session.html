{ id: 2, num: '02', init: 'بع', name: 'بدر راشد العتيبي', gate: 'l', note: 'عاد من العيادة 09:56' },
{ id: 3, num: '03', init: 'خد', name: 'خالد سلطان الدوسري', gate: 'a', note: 'لم يُسجَّل دخوله اليوم' },
{ id: 4, num: '04', init: 'زح', name: 'زياد سامي الحربي', gate: 'e', note: 'استئذان معتمد من ولي الأمر' },
{ id: 5, num: '05', init: 'سش', name: 'سعود فيصل الشمري', gate: 'p', note: 'بطاقة ذكية · دخل 06:51' },
{ id: 6, num: '06', init: 'عق', name: 'عمر عبدالعزيز القحطاني', gate: 'p', note: 'بطاقة ذكية · دخل 07:02' },
{ id: 7, num: '07', init: 'فم', name: 'فارس ناصر المطيري', gate: 'p', note: 'بطاقة ذكية · دخل 06:49' },
{ id: 8, num: '08', init: 'مس', name: 'ماجد حمد السبيعي', gate: 'a', note: 'غياب لليوم الثالث · أُحيل للمرشد' },

{ id: 10, num: '10', init: 'يع', name: 'يوسف سعد العنزي', gate: 'p', note: 'بطاقة ذكية · دخل 07:05' }
];
const tones = {
p: 'background: #047857; color: #FFFFFF;',
l: 'background: #B45309; color: #FFFFFF;',
a: 'background: #B91C1C; color: #FFFFFF;',
e: 'background: #1D4ED8; color: #FFFFFF;'
};

let cp = 24, ca = 0, co = 0;
const students = base.map((s) => {
const cur = over[s.id] || s.gate;
if (cur === 'p' || cur === 'l') cp++;
if (cur === 'a') ca++;
if (cur === 'l' || cur === 'e') co++;
const set = (k) => () => this.setState({ over: Object.assign({}, over, { [s.id]: k }) });
return Object.assign({}, s, {

pOn: cur === 'p' ? 'true' : 'false', lOn: cur === 'l' ? 'true' : 'false',

setP: set('p'), setL: set('l'), setA: set('a'), setE: set('e'),
rowBg: started && cur === 'a' ? '#FEF2F2' : '#FFFFFF'
});
});
let timer = '45:00', timerLabel = 'مدة الحصة', timerSub = 'لم تبدأ بعد';
if (started) {
const endAt = ended ? st.endedAt : Date.now();
const sec = Math.max(0, Math.floor((endAt - st.startedAt) / 1000));
const left = Math.max(0, 2700 - sec);
timer = pad(Math.floor(left / 60)) + ':' + pad(left % 60);
timerLabel = ended ? 'مدة الحصة الفعلية' : 'الوقت المتبقي';
timerSub = 'انقضى ' + pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
}
return {
students: students,
started: started, notStarted: !started, running: started && !ended, ended: ended,
start: () => this.setState({ startedAt: Date.now(), endedAt: null }),
end: () => this.setState({ endedAt: Date.now() }),
restart: () => this.setState({ startedAt: null, endedAt: null, over: {} }),
startTime: started ? clock(new Date(st.startedAt)) : '',
endTime: ended ? clock(new Date(st.endedAt)) : '',
timer: timer, timerLabel: timerLabel, timerSub: timerSub,
cPresent: started ? String(cp) : '—', cAbsent: started ? String(ca) : '—', cOther: started ? String(co) : '—',
autoTitle: started ? 'تم تنفيذ الإجراءات التلقائية لحظة بدء الحصة' : 'عند الضغط على «بدء الحصة» ينفّذ النظام تلقائياً:',

};
